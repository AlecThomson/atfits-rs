[package]
name = "atfits-rs"
# Set from the release tag by the CD workflow.
version = "0.0.0"
edition = "2024"
authors = ["Alec Thomson"]
license = "BSD-3-Clause"
description = "cfitsio helpers (pixel I/O, header editing, image creation) shared by the at*-rs FITS tools"
repository = "https://github.com/AlecThomson/atfits-rs"
documentation = "https://docs.rs/atfits-rs"
readme = "README.md"

[package.metadata.docs.rs]
# docs.rs cannot build cfitsio from source (read-only tree) but has libcfitsio-dev.
no-default-features = true
features = []

[lib]
name = "atfits_rs"
path = "src/lib.rs"

[features]
# Compile cfitsio from source instead of linking the system library.
default = []
fitsio-src = ["fitsio/fitsio-src"]

[dependencies]
fitsio = { version = "0.21" }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
